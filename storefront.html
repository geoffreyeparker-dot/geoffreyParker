<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storefront</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>Geoffrey Parker Store</h1>
</header>

<nav>
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Products</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</nav>

<main>
    <section>
        <h2>Product Listing</h2>

        <table>
            <caption>Store Inventory</caption>

            <colgroup>
                <col>
                <col span="2">
                <col>
            </colgroup>

            <thead>
                <tr>
                    <th>Product Name</th>
                    <th>Price</th>
                    <th>Category</th>
                    <th>Availability</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Keyboard</td>
                    <td>$50</td>
                    <td>Electronics</td>
                    <td>In Stock</td>
                </tr>

                <tr>
                    <td>Mouse</td>
                    <td>$25</td>
                    <td>Electronics</td>
                    <td>In Stock</td>
                </tr>

                <tr>
                    <td>Monitor</td>
                    <td>$200</td>
                    <td>Electronics</td>
                    <td>Low Stock</td>
                </tr>
            </tbody>

            <tfoot>
                <tr>
                    <td colspan="4">Inventory Updated Weekly</td>
                </tr>
            </tfoot>
        </table>

    </section>
</main>

<footer>
    <p>&copy; 2026 Geoffrey Parker</p>
</footer>

</body>
</html>
